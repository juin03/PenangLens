name: Deploy Agent

on:
  push:
    branches: [main]
    paths: [Agent/**]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az acr build --registry penanglenscr --image agent:${{ github.sha }} ./Agent
      - run: az containerapp update --name agent --resource-group rg-penanglens --image penanglenscr.azurecr.io/agent:${{ github.sha }} --min-replicas 1
