name: Update Mobile App

on:
  push:
    branches: [main]
    paths: [MobileApp/**]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: MobileApp
      - name: Publish OTA update
        working-directory: MobileApp
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Pass the commit message via env (not direct ${{ }} interpolation) so quotes,
          # newlines, or other shell metacharacters in it cannot break the command.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Use only the first line of the commit message, capped to a safe length.
          MSG="$(printf '%s' "$COMMIT_MSG" | head -n1 | cut -c1-200)"
          npx eas-cli update --branch preview --message "$MSG" --platform android --non-interactive
