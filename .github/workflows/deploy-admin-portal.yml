name: Deploy Admin Portal

on:
  push:
    branches: [main]
    paths:
      - admin-portal/**
      - .github/workflows/deploy-admin-portal.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az acr build --registry penanglenscr --image admin-portal:${{ github.sha }} --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }} ./admin-portal
      - run: az containerapp update --name admin-portal --resource-group rg-penanglens --image penanglenscr.azurecr.io/admin-portal:${{ github.sha }} --min-replicas 0
